name: Apply today gameplay fixes

on:
  push:
    branches: [feature/universal-qr-games]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/universal-qr-games
          fetch-depth: 0

      - name: Patch Sheikh Beard and football
        shell: python
        run: |
          from pathlib import Path
          import re

          # ---- Sheikh Beard: score every real 3-point segment on all 3 axes ----
          p = Path('lib/games/line_games/line_games.dart')
          s = p.read_text(encoding='utf-8')
          old = '''      // A triangular board has three straight-line axes. Only real lines
      // of three or more points can score.
      for (var row = 0; row < rows; row++) {
        final line = List<int>.generate(
          row + 1,
          (index) => rowStarts[row] + index,
        );
        if (line.length >= 3) _sheikhLines.add(line);
      }

      // First diagonal direction.
      for (var column = 0; column < rows; column++) {
        final line = <int>[];
        for (var row = column; row < rows; row++) {
          line.add(rowStarts[row] + column);
        }
        if (line.length >= 3) _sheikhLines.add(line);
      }

      // Second diagonal direction (the previously missing cross axis).
      for (var diagonal = 0; diagonal < rows; diagonal++) {
        final line = <int>[];
        for (var row = diagonal; row < rows; row++) {
          final column = row - diagonal;
          line.add(rowStarts[row] + column);
        }
        if (line.length >= 3) _sheikhLines.add(line);
      }
'''
          new = '''      // Sheikh Beard scores every contiguous 3-point straight segment.
      // This fixes missed ordinary and cross lines: a long row no longer has
      // to be completely filled before its visible 3-point segments count.
      void addTriples(List<int> axis) {
        if (axis.length < 3) return;
        for (var start = 0; start <= axis.length - 3; start++) {
          _sheikhLines.add(axis.sublist(start, start + 3));
        }
      }

      // Horizontal axis.
      for (var row = 0; row < rows; row++) {
        addTriples(List<int>.generate(
          row + 1,
          (index) => rowStarts[row] + index,
        ));
      }

      // Down-left / up-right axis.
      for (var column = 0; column < rows; column++) {
        final axis = <int>[];
        for (var row = column; row < rows; row++) {
          axis.add(rowStarts[row] + column);
        }
        addTriples(axis);
      }

      // Down-right / up-left axis (cross axis).
      for (var diagonal = 0; diagonal < rows; diagonal++) {
        final axis = <int>[];
        for (var row = diagonal; row < rows; row++) {
          final column = row - diagonal;
          axis.add(rowStarts[row] + column);
        }
        addTriples(axis);
      }
'''
          if old not in s:
              raise SystemExit('Sheikh board block not found')
          s = s.replace(old, new, 1)
          s = s.replace('''      _claimedSheikhLines[key] = playerId;\n      gained += line.length;''', '''      _claimedSheikhLines[key] = playerId;\n      gained++;''', 1)

          # Browser sound cues for the QR version of line games.
          js_anchor = "const ctx=canvas.getContext('2d');\n"
          js_audio = """const ctx=canvas.getContext('2d');
let audioCtx=null,lastScoreTotal=0;
function beep(freq=660,duration=.07,gain=.055){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=freq;g.gain.value=gain;
    o.connect(g);g.connect(audioCtx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}
"""
          if js_anchor in s:
              s = s.replace(js_anchor, js_audio, 1)
          move_send = "ws.send(JSON.stringify({type:'move',index:best}));"
          s = s.replace(move_send, "beep(720,.055,.045);\n      "+move_send, 1)
          # Replace second occurrence for Dots & Boxes.
          idx = s.find(move_send, s.find(move_send)+1)
          if idx >= 0:
              s = s[:idx] + "beep(720,.055,.045);\n      " + s[idx:]
          score_anchor = "document.getElementById('scores').innerHTML=(state.players||[])"
          if score_anchor in s:
              inject = """const scoreTotal=(state.players||[]).reduce((n,p)=>n+(p.score||0),0);
  if(scoreTotal>lastScoreTotal)beep(1040,.14,.075);
  lastScoreTotal=scoreTotal;
  """
              s = s.replace(score_anchor, inject + score_anchor, 1)
          p.write_text(s, encoding='utf-8')

          # ---- Football: immersive broadcast/first-person view + real game audio ----
          p = Path('lib/games/football/photo_penalty_game_v3.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import '../../core/network/local_network_core.dart';", "import '../../core/audio_feedback.dart';\nimport '../../core/network/local_network_core.dart';", 1)

          # Use the central audio engine, not isolated haptics.
          s = s.replace('    HapticFeedback.lightImpact();\n    await _animateShot();', '    GameFeedback.kick();\n    await _animateShot();', 1)
          s = s.replace('    HapticFeedback.mediumImpact();\n    await _animateShot();', '    GameFeedback.kick();\n    await _animateShot();', 1)

          result_block = '''      _phase = _PenaltyPhase.result;\n      _message = _resultText(result);\n    });\n    await Future<void>.delayed'''
          replacement = '''      _phase = _PenaltyPhase.result;\n      _message = _resultText(result);\n    });\n    switch (result) {\n      case _PenaltyOutcome.goal:\n        GameFeedback.goal();\n        break;\n      case _PenaltyOutcome.save:\n        GameFeedback.save();\n        break;\n      case _PenaltyOutcome.post:\n        GameFeedback.post();\n        break;\n      case _PenaltyOutcome.miss:\n        GameFeedback.error();\n        break;\n    }\n    await Future<void>.delayed'''
          if result_block not in s:
              raise SystemExit('player result block not found')
          s = s.replace(result_block, replacement, 1)

          robot_block = '''      _phase = _PenaltyPhase.result;\n      _message = result == _PenaltyOutcome.save ? 'تصـــدٍ رائع!' : _resultText(result);\n    });\n    await Future<void>.delayed'''
          robot_replacement = '''      _phase = _PenaltyPhase.result;\n      _message = result == _PenaltyOutcome.save ? 'تصـــدٍ رائع!' : _resultText(result);\n    });\n    switch (result) {\n      case _PenaltyOutcome.goal:\n        GameFeedback.goal();\n        break;\n      case _PenaltyOutcome.save:\n        GameFeedback.save();\n        break;\n      case _PenaltyOutcome.post:\n        GameFeedback.post();\n        break;\n      case _PenaltyOutcome.miss:\n        GameFeedback.error();\n        break;\n    }\n    await Future<void>.delayed'''
          if robot_block not in s:
              raise SystemExit('robot result block not found')
          s = s.replace(robot_block, robot_replacement, 1)

          # Remove the oversized photographic shooter layer that made the scene look pasted-on.
          shooter_pattern = re.compile(r'''\n                        Positioned\(\n                          left: -size\.width \* \.08,\n                          bottom: size\.height \* \.05,\n                          width: size\.width \* \.64,\n                          height: size\.height \* \.54,\n                          child: Opacity\(.*?\n                        \),''', re.S)
          s, count = shooter_pattern.subn('', s, count=1)
          if count != 1:
              raise SystemExit('shooter layer not found')

          # Remove now-unused shooter variable and player pose helper.
          s = s.replace("                  final shooter = _playerIsShooting ? _playerTeam : _robotTeam;\n", '', 1)
          s = re.sub(r'''\n  FootballSpritePose _playerPose\(\) \{.*?\n  \}\n\n  FootballSpritePose _keeperPose''', '\n  FootballSpritePose _keeperPose', s, count=1, flags=re.S)

          # Add a real foreground ball at the penalty spot while aiming/saving.
          keeper_anchor = '''                        Positioned(\n                          left: keeperPos.dx - size.width * .26,'''
          foreground = '''                        if (_phase == _PenaltyPhase.aiming || _phase == _PenaltyPhase.saving)\n                          Positioned(\n                            left: ballStart.dx - 31,\n                            top: ballStart.dy - 31,\n                            child: const _PenaltySpotBall(),\n                          ),\n                        Positioned(\n                          left: keeperPos.dx - size.width * .26,'''
          if keeper_anchor not in s:
              raise SystemExit('keeper anchor not found')
          s = s.replace(keeper_anchor, foreground, 1)

          # Make flying ball scale down naturally with depth.
          old_ball = '''                        if (_phase == _PenaltyPhase.flying || _phase == _PenaltyPhase.result)\n                          Positioned(\n                            left: ball.dx - 16,\n                            top: ball.dy - 16,\n                            child: Transform.rotate(\n                              angle: _shot.value * math.pi * 8,\n                              child: const _PhotoBall(),\n                            ),\n                          ),'''
          new_ball = '''                        if (_phase == _PenaltyPhase.flying || _phase == _PenaltyPhase.result)\n                          Positioned(\n                            left: ball.dx - (30 - flightT * 16),\n                            top: ball.dy - (30 - flightT * 16),\n                            child: Transform.scale(\n                              scale: 1.85 - flightT * .85,\n                              child: Transform.rotate(\n                                angle: _shot.value * math.pi * 9,\n                                child: const _PhotoBall(),\n                              ),\n                            ),\n                          ),'''
          if old_ball not in s:
              raise SystemExit('flying ball block not found')
          s = s.replace(old_ball, new_ball, 1)

          # Add more broadcast-like goal frame/net overlay and a foreground penalty ball widget.
          insert_before = '\nclass _PhotoBall extends StatelessWidget {'
          addition = r'''
class _PenaltySpotBall extends StatelessWidget {
  const _PenaltySpotBall();

  @override
  Widget build(BuildContext context) {
    return Container(
      width: 62,
      height: 62,
      decoration: const BoxDecoration(
        shape: BoxShape.circle,
        boxShadow: <BoxShadow>[
          BoxShadow(color: Color(0xAA000000), blurRadius: 18, offset: Offset(5, 12)),
          BoxShadow(color: Color(0x5538BDF8), blurRadius: 24),
        ],
      ),
      child: const _PhotoBall(),
    );
  }
}
'''
          if insert_before not in s:
              raise SystemExit('photo ball class anchor not found')
          s = s.replace(insert_before, addition + insert_before, 1)

          # Heavier goal frame + finer net grid for depth.
          s = s.replace("      ..color = Colors.white.withAlpha(78)\n      ..strokeWidth = 1;", "      ..color = Colors.white.withAlpha(70)\n      ..strokeWidth = 1;", 1)
          grid_old = '''    for (var i = 1; i < 3; i++) {\n      canvas.drawLine(\n        Offset(size.width * i / 3, 0),\n        Offset(size.width * i / 3, size.height),\n        paint,\n      );\n      canvas.drawLine(\n        Offset(0, size.height * i / 3),\n        Offset(size.width, size.height * i / 3),\n        paint,\n      );\n    }'''
          grid_new = '''    for (var i = 1; i < 7; i++) {\n      canvas.drawLine(\n        Offset(size.width * i / 7, 0),\n        Offset(size.width * i / 7, size.height),\n        paint,\n      );\n    }\n    for (var i = 1; i < 5; i++) {\n      canvas.drawLine(\n        Offset(0, size.height * i / 5),\n        Offset(size.width, size.height * i / 5),\n        paint,\n      );\n    }\n    final frame = Paint()\n      ..color = Colors.white.withAlpha(225)\n      ..style = PaintingStyle.stroke\n      ..strokeWidth = 5;\n    canvas.drawRRect(\n      RRect.fromRectAndRadius(Offset.zero & size, const Radius.circular(2)),\n      frame,\n    );'''
          if grid_old not in s:
              raise SystemExit('goal grid block not found')
          s = s.replace(grid_old, grid_new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/games/line_games/line_games.dart lib/games/football/photo_penalty_game_v3.dart
          git commit -m "Fix Sheikh scoring and overhaul penalty presentation"
          git push origin HEAD:feature/universal-qr-games

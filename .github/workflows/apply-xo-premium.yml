name: Apply XO Premium Polish

on:
  push:
    branches: [feature/world-class-ui-v2]
    paths:
      - '.github/workflows/apply-xo-premium.yml'

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/world-class-ui-v2
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply XO visual-only polish
        run: python tools/apply_xo_premium.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run full Flutter tests
        run: flutter test
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Commit verified XO polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/games/xo/xo_game.dart
          git commit -m "Polish premium XO game presentation"
          git push origin HEAD:feature/world-class-ui-v2

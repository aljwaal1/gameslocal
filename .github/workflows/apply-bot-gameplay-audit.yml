name: Apply Bot Gameplay Audit

on:
  push:
    branches: [fix/bot-gameplay-audit]
    paths:
      - '.github/workflows/apply-bot-gameplay-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bot-gameplay-audit
          fetch-depth: 0
      - name: Apply targeted bot fixes
        run: python tools/fix_bot_gameplay_audit.py
      - name: Commit bot fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/games/xo/xo_game.dart lib/games/domino/domino_game.dart test/bot_gameplay_regression_test.dart
          git commit -m "Fix XO bot turn and domino bot opener"
          git push origin HEAD:fix/bot-gameplay-audit

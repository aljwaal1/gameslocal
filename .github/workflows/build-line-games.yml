name: Build Line Games APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/games/line_games/**'
      - 'tools/register_line_games.py'
      - '.github/workflows/build-line-games.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameslocal-line-games-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Register games
        run: python3 tools/register_line_games.py
      - name: Create Android files
        run: flutter create --platforms=android --org com.explapp --no-pub .
      - name: Configure network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          t=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms=['<uses-permission android:name="android.permission.INTERNET" />','<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />','<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />','<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />']
          add=[x for x in perms if x not in t]
          if add:t=t.replace(marker,marker+'\n    '+'\n    '.join(add))
          p.write_text(t)
          PY
      - name: Format
        run: dart format lib/main.dart lib/core/game_room.dart lib/games/line_games/line_games.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release
      - name: Prepare publication
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p /tmp/line-games/lib apk/modern release
          cp -R lib /tmp/line-games/lib
          cp build/app/outputs/flutter-apk/app-release.apk apk/modern/gameslocal-flutter.apk
          cp build/app/outputs/flutter-apk/app-release.apk release/gameslocal-flutter.apk
          sha256sum release/gameslocal-flutter.apk > release/gameslocal-flutter.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gameslocal-line-games-${{ github.run_number }}
          path: |
            release/gameslocal-flutter.apk
            release/gameslocal-flutter.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish source and APK
        run: |
          set -euo pipefail
          cp apk/modern/gameslocal-flutter.apk /tmp/gameslocal-flutter.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          rm -rf lib
          cp -R /tmp/line-games/lib ./lib
          mkdir -p apk/modern
          cp /tmp/gameslocal-flutter.apk apk/modern/gameslocal-flutter.apk
          git add lib apk/modern/gameslocal-flutter.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Sheikh Beard and Dots Boxes games with Android APK"
          git push origin HEAD:main

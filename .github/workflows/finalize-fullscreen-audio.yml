name: Finalize Fullscreen Audio

on:
  push:
    branches: [feature/fullscreen-polish]
    paths:
      - '.github/workflows/finalize-fullscreen-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fullscreen-polish
          fetch-depth: 0
      - name: Diagnose final fullscreen and audio pass
        shell: bash
        run: |
          set +e
          python tools/finalize_fullscreen_audio.py > tools/finalize_fullscreen_audio.log 2>&1
          CODE=$?
          echo "EXIT_CODE=$CODE" >> tools/finalize_fullscreen_audio.log
          cat tools/finalize_fullscreen_audio.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CODE" -eq 0 ]; then
            git add lib/games tools/finalize_fullscreen_audio.log
            git commit -m "Finish fullscreen layouts and game audio"
          else
            git add tools/finalize_fullscreen_audio.log
            git commit -m "Record fullscreen audio patch failure"
          fi
          git push origin HEAD:feature/fullscreen-polish

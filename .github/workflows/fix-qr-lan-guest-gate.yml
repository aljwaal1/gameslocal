name: Fix QR LAN Guest Gate

on:
  push:
    branches: [feature/world-class-ui-v2]
    paths:
      - '.github/workflows/fix-qr-lan-guest-gate.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/world-class-ui-v2
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply reviewed QR/LAN gate fix
        run: python tools/fix_qr_lan_guest_gate.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run full Flutter tests
        run: flutter test
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Commit verified gate fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/games/line_games/line_games.dart lib/games/name_animal_object/name_animal_object_game.dart test/pregame_qr_all_browser_games_test.dart
          git commit -m "Fix QR lobby gating for Android LAN guests"
          git push origin HEAD:feature/world-class-ui-v2

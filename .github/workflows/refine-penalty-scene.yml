name: Refine penalty scene

on:
  push:
    branches: [feature/universal-qr-games]
    paths:
      - '.github/workflows/refine-penalty-scene.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/universal-qr-games
          fetch-depth: 0
      - name: Refine football scene
        run: python tools/refine_penalty_scene.py
      - name: Commit refined scene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/games/football/photo_penalty_game_v3.dart
          git commit -m "Refine professional penalty scene composition"
          git push origin HEAD:feature/universal-qr-games

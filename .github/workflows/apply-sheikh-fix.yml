name: Apply Sheikh Beard scoring fix

on:
  push:
    branches: [fix/sheikh-beard-scoring-and-turn-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sheikh-beard-scoring-and-turn-ui
          fetch-depth: 0
      - name: Patch Sheikh Beard scoring and turn UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/games/line_games/line_games.dart')
          s = p.read_text()

          old_css = ".scores{display:flex;gap:8px;flex-wrap:wrap}.pill{flex:1;min-width:110px;background:#eee8ff;border-radius:14px;padding:10px;text-align:center}"
          new_css = ".scores{display:flex;gap:8px;flex-wrap:wrap}.pill{flex:1;min-width:110px;background:#eee8ff;border-radius:14px;padding:10px;text-align:center}.turn{font-size:18px;font-weight:800;text-align:center;margin-bottom:12px}.turn-name{font-size:27px;font-weight:950;display:inline-block;margin-inline-start:6px}.player-name{font-weight:900;font-size:18px}"
          if old_css not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(old_css, new_css, 1)

          old_js = "  document.getElementById('status').textContent=state.message||'';\n  document.getElementById('scores').innerHTML=(state.players||[])\n    .map(p=>`<div class=\"pill\">\\${p.name}<br><b>\\${p.score||0}</b></div>`).join('');"
          new_js = "  const turnPlayer=(state.players||[]).find(p=>p.id===state.turnId);\n  const status=document.getElementById('status');\n  if(turnPlayer){\n    status.className='turn';\n    status.innerHTML=`الدور: <span class=\"turn-name\" style=\"color:\\${turnPlayer.color||'#6f2dbd'}\">\\${turnPlayer.name}</span>`;\n  }else{\n    status.className='turn';\n    status.textContent=state.message||'';\n  }\n  document.getElementById('scores').innerHTML=(state.players||[])\n    .map(p=>`<div class=\"pill\"><span class=\"player-name\" style=\"color:\\${p.color||'#241a2e'}\">\\${p.name}</span><br><b>\\${p.score||0}</b></div>`).join('');"
          if old_js not in s:
              raise SystemExit('JS status anchor not found')
          s = s.replace(old_js, new_js, 1)

          old_lines = """      for (var row = 0; row < rows; row++) {
        _sheikhLines.add(
          List<int>.generate(
            row + 1,
            (index) => rowStarts[row] + index,
          ),
        );
      }

      for (var column = 0; column < rows; column++) {
        final line = <int>[];
        for (var row = column; row < rows; row++) {
          line.add(rowStarts[row] + column);
        }
        if (line.length >= 3) _sheikhLines.add(line);
      }
      return;"""
          new_lines = """      // A triangular board has three straight-line axes. Only real lines
      // (three or more points) are scoreable.
      for (var row = 0; row < rows; row++) {
        final line = List<int>.generate(
          row + 1,
          (index) => rowStarts[row] + index,
        );
        if (line.length >= 3) _sheikhLines.add(line);
      }

      // Diagonal axis 1: same column while moving down the triangle.
      for (var column = 0; column < rows; column++) {
        final line = <int>[];
        for (var row = column; row < rows; row++) {
          line.add(rowStarts[row] + column);
        }
        if (line.length >= 3) _sheikhLines.add(line);
      }

      // Diagonal axis 2 (the missing cross direction): keep row-column
      // constant while moving down-right.
      for (var diagonal = 0; diagonal < rows; diagonal++) {
        final line = <int>[];
        for (var row = diagonal; row < rows; row++) {
          final column = row - diagonal;
          line.add(rowStarts[row] + column);
        }
        if (line.length >= 3) _sheikhLines.add(line);
      }
      return;"""
          if old_lines not in s:
              raise SystemExit('Sheikh line-generation anchor not found')
          s = s.replace(old_lines, new_lines, 1)

          old_footer = """            child: Text(
              players.length < 2
                  ? 'بانتظار لاعب آخر'
                  : _turnId == _myId
                      ? 'دورك الآن'
                      : 'بانتظار دور اللاعب الآخر',
              style: const TextStyle(
                fontWeight: FontWeight.w800,
                fontSize: 16,
              ),
            ),"""
          new_footer = """            child: Builder(
              builder: (context) {
                if (players.length < 2) {
                  return const Text(
                    'بانتظار لاعب آخر',
                    style: TextStyle(fontWeight: FontWeight.w800, fontSize: 16),
                  );
                }
                final turnPlayerIndex = players.indexWhere(
                  (player) => player['id'] == _turnId,
                );
                final turnPlayerName = turnPlayerIndex >= 0
                    ? players[turnPlayerIndex]['name'] ?? ''
                    : '';
                final turnColor = turnPlayerIndex >= 0
                    ? _colors[turnPlayerIndex % _colors.length]
                    : Theme.of(context).colorScheme.primary;
                return RichText(
                  textAlign: TextAlign.center,
                  text: TextSpan(
                    style: DefaultTextStyle.of(context).style.copyWith(
                      fontWeight: FontWeight.w800,
                      fontSize: 18,
                    ),
                    children: <InlineSpan>[
                      const TextSpan(text: 'الدور: '),
                      TextSpan(
                        text: turnPlayerName,
                        style: TextStyle(
                          color: turnColor,
                          fontSize: 25,
                          fontWeight: FontWeight.w900,
                        ),
                      ),
                      if (_turnId == _myId)
                        const TextSpan(
                          text: '  • دورك',
                          style: TextStyle(fontSize: 16),
                        ),
                    ],
                  ),
                );
              },
            ),"""
          if old_footer not in s:
              raise SystemExit('Flutter turn footer anchor not found')
          s = s.replace(old_footer, new_footer, 1)

          p.write_text(s)
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/games/line_games/line_games.dart
          git commit -m "Fix Sheikh Beard cross scoring and player turn colors"
          git push origin HEAD:fix/sheikh-beard-scoring-and-turn-ui

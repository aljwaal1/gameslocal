name: Remove chicken game

on:
  push:
    branches: [feature/universal-qr-games]
    paths:
      - '.github/workflows/remove-chicken-game.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/universal-qr-games
          fetch-depth: 0
      - name: Remove chicken game from app registry
        run: python tools/remove_chicken_game.py
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Remove chicken game from app"
          git push origin HEAD:feature/universal-qr-games

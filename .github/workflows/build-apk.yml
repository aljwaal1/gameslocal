name: Build APK Direct

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameslocal-main-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Remove generated tests
        run: rm -rf test

      - name: Configure Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />',
          ]
          additions = [item for item in permissions if item not in text]
          if additions:
              text = text.replace(marker, marker + '\n    ' + '\n    '.join(additions))
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Normalize new multiplayer source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/games/name_animal_object/name_animal_object_game.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace("(payload['points'] as Map? ?? {})", "((payload['points'] as Map?) ?? <dynamic, dynamic>{})")
          text = text.replace("(payload['scores'] as Map? ?? {})", "((payload['scores'] as Map?) ?? <dynamic, dynamic>{})")
          text = text.replace("(payload['names'] as Map? ?? {})", "((payload['names'] as Map?) ?? <dynamic, dynamic>{})")
          text = text.replace("(payload['answers'] as Map? ?? {})", "((payload['answers'] as Map?) ?? <dynamic, dynamic>{})")
          text = text.replace(
              "final msg={'action':'categories_score_proposal',...proposal..remove('approvals')};",
              "final msg=<String,dynamic>{'action':'categories_score_proposal',...proposal};msg.remove('approvals');",
          )
          path.write_text(text, encoding='utf-8')
          PY
          dart format lib/games/name_animal_object/name_animal_object_game.dart lib/games/name_animal_object/iphone_web_bridge.dart

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p release apk/modern
          cp build/app/outputs/flutter-apk/app-release.apk release/gameslocal-flutter.apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/modern/gameslocal-flutter.apk
          sha256sum release/gameslocal-flutter.apk > release/gameslocal-flutter.apk.sha256
          cp lib/games/name_animal_object/name_animal_object_game.dart /tmp/name_animal_object_game.dart
          cp lib/games/name_animal_object/iphone_web_bridge.dart /tmp/iphone_web_bridge.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameslocal-flutter-apk-${{ github.run_number }}
          path: |
            release/gameslocal-flutter.apk
            release/gameslocal-flutter.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish corrected source and APK to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cp apk/modern/gameslocal-flutter.apk /tmp/gameslocal-flutter.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p apk/modern lib/games/name_animal_object
          cp /tmp/gameslocal-flutter.apk apk/modern/gameslocal-flutter.apk
          cp /tmp/name_animal_object_game.dart lib/games/name_animal_object/name_animal_object_game.dart
          cp /tmp/iphone_web_bridge.dart lib/games/name_animal_object/iphone_web_bridge.dart
          git add apk/modern/gameslocal-flutter.apk lib/games/name_animal_object/name_animal_object_game.dart lib/games/name_animal_object/iphone_web_bridge.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish synchronized multiplayer update and Android APK"
          git push origin HEAD:main

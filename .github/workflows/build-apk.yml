name: Build APK Direct

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'tools/apply_football_motion_overhaul.py'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameslocal-modern-flutter
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import real football photographs and timing
        id: football_import
        continue-on-error: true
        run: |
          set +e
          python3 tools/apply_football_motion_overhaul.py > football-import.log 2>&1
          status=$?
          echo "$status" > football-import.status
          cat football-import.log
          exit "$status"

      - name: Upload football import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-import-diagnostics
          path: |
            football-import.log
            football-import.status
          if-no-files-found: error

      - name: Verify football import succeeded
        run: test "$(cat football-import.status)" = "0"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Flutter project
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Add Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        id: flutter_tests
        continue-on-error: true
        run: |
          set +e
          flutter test > flutter-test.log 2>&1
          status=$?
          echo "$status" > flutter-test.status
          cat flutter-test.log
          exit "$status"

      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-diagnostics
          path: |
            flutter-test.log
            flutter-test.status
          if-no-files-found: error

      - name: Verify Flutter tests succeeded
        run: test "$(cat flutter-test.status)" = "0"

      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter APK
        run: flutter build apk --release

      - name: Copy APK files
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p apk/modern
          cp build/app/outputs/flutter-apk/app-release.apk apk/modern/gameslocal-flutter.apk
          cat > DOWNLOAD_APK.md <<'EOF'
          # تحميل تطبيق ألعاب محلية

          ## نسخة الأجهزة الحديثة - Flutter
          https://github.com/aljwaal1/gameslocal/raw/main/apk/modern/gameslocal-flutter.apk
          EOF

      - name: Commit APK and generated offline football assets
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            apk/modern/gameslocal-flutter.apk \
            DOWNLOAD_APK.md \
            assets/football/photo \
            lib/games/football/professional_penalty_game.dart \
            test/professional_penalty_visual_contract_test.dart
          git commit -m "Build APK with photographic football overhaul" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Build APK Direct

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameslocal-modern-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Configure Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />',
          ]
          additions = [item for item in permissions if item not in text]
          if additions:
              text = text.replace(marker, marker + '\n    ' + '\n    '.join(additions))
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p apk/modern release
          cp build/app/outputs/flutter-apk/app-release.apk release/gameslocal-flutter.apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/modern/gameslocal-flutter.apk
          sha256sum release/gameslocal-flutter.apk > release/gameslocal-flutter.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameslocal-flutter-apk-${{ github.run_number }}
          path: |
            release/gameslocal-flutter.apk
            release/gameslocal-flutter.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > DOWNLOAD_APK.md <<'EOF'
          # تحميل تطبيق ألعاب محلية

          ## نسخة Android الحديثة
          https://github.com/aljwaal1/gameslocal/raw/main/apk/modern/gameslocal-flutter.apk
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apk/modern/gameslocal-flutter.apk DOWNLOAD_APK.md
          if git diff --cached --quiet; then
            echo "APK is already current."
            exit 0
          fi
          git commit -m "Publish latest Android APK"
          git pull --rebase origin main
          git push origin HEAD:main

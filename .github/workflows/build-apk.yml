name: Build Verified Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameslocal-verified-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build and capture diagnostics
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p build-status release apk/modern /tmp/gameslocal-output
          : > build-status/latest.log
          echo "COMMIT=$GITHUB_SHA" | tee -a build-status/latest.log
          echo "RUN_ID=$GITHUB_RUN_ID" | tee -a build-status/latest.log

          WIDGET_TEST_TRACKED=0
          git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1 && WIDGET_TEST_TRACKED=1

          echo "=== CREATE ANDROID ===" | tee -a build-status/latest.log
          flutter create --platforms=android --org com.explapp --no-pub . 2>&1 | tee -a build-status/latest.log
          CREATE=${PIPESTATUS[0]}
          if [ "$WIDGET_TEST_TRACKED" -eq 0 ]; then
            rm -f test/widget_test.dart
          fi

          python3 - <<'PY' 2>&1 | tee -a build-status/latest.log
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />',
          ]
          missing = [item for item in permissions if item not in text]
          if missing:
              text = text.replace(marker, marker + '\n    ' + '\n    '.join(missing))
          p.write_text(text, encoding='utf-8')
          PY
          MANIFEST=${PIPESTATUS[0]}

          echo "=== PUB GET ===" | tee -a build-status/latest.log
          flutter pub get 2>&1 | tee -a build-status/latest.log
          PUB=${PIPESTATUS[0]}

          echo "=== ANALYZE ===" | tee -a build-status/latest.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build-status/latest.log
          ANALYZE=${PIPESTATUS[0]}

          BUILD=1
          if [ "$CREATE" -eq 0 ] && [ "$MANIFEST" -eq 0 ] && [ "$PUB" -eq 0 ] && [ "$ANALYZE" -eq 0 ]; then
            echo "=== BUILD APK ===" | tee -a build-status/latest.log
            flutter build apk --release 2>&1 | tee -a build-status/latest.log
            BUILD=${PIPESTATUS[0]}
          else
            echo "APK build skipped because a required check failed." | tee -a build-status/latest.log
          fi

          echo "CREATE_CODE=$CREATE" | tee -a build-status/latest.log
          echo "MANIFEST_CODE=$MANIFEST" | tee -a build-status/latest.log
          echo "PUB_CODE=$PUB" | tee -a build-status/latest.log
          echo "ANALYZE_CODE=$ANALYZE" | tee -a build-status/latest.log
          echo "BUILD_CODE=$BUILD" | tee -a build-status/latest.log

          if [ "$BUILD" -eq 0 ] && [ -s build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release/gameslocal-flutter.apk
            cp build/app/outputs/flutter-apk/app-release.apk apk/modern/gameslocal-flutter.apk
            sha256sum release/gameslocal-flutter.apk > release/gameslocal-flutter.apk.sha256
            cp apk/modern/gameslocal-flutter.apk /tmp/gameslocal-output/gameslocal-flutter.apk
            cp release/gameslocal-flutter.apk.sha256 /tmp/gameslocal-output/gameslocal-flutter.apk.sha256
            echo "RESULT=SUCCESS" | tee -a build-status/latest.log
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT=FAILED" | tee -a build-status/latest.log
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
          cp build-status/latest.log /tmp/gameslocal-output/latest.log
          exit 0

      - name: Upload verified APK
        if: steps.compile.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gameslocal-verified-apk-${{ github.run_number }}
          path: |
            release/gameslocal-flutter.apk
            release/gameslocal-flutter.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK result only
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          mkdir -p build-status apk/modern release
          cp /tmp/gameslocal-output/latest.log build-status/latest.log

          MESSAGE='Publish Android APK build report'
          if grep -q 'RESULT=SUCCESS' build-status/latest.log; then
            cp /tmp/gameslocal-output/gameslocal-flutter.apk apk/modern/gameslocal-flutter.apk
            cp /tmp/gameslocal-output/gameslocal-flutter.apk.sha256 release/gameslocal-flutter.apk.sha256
            git add apk/modern/gameslocal-flutter.apk release/gameslocal-flutter.apk.sha256
            MESSAGE='Publish Android APK from exact main source'
          fi

          git add -f build-status/latest.log
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m "$MESSAGE"
          git push origin HEAD:main

      - name: Mark failed build
        if: steps.compile.outputs.success != 'true'
        run: exit 1

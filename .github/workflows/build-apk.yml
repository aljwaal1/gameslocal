name: Build APK Direct

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'tools/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameslocal-main-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply requested game updates
        run: |
          if [ ! -f lib/core/network/browser_game_bridge.dart ]; then
            python3 tools/apply_requested_updates.py
          else
            echo "Requested updates already applied."
          fi

      - name: Create Android project files
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Remove generated tests
        run: rm -rf test

      - name: Configure Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />',
          ]
          additions = [item for item in permissions if item not in text]
          if additions:
              text = text.replace(marker, marker + '\n    ' + '\n    '.join(additions))
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Format updated sources
        run: |
          dart format \
            lib/core/audio_feedback.dart \
            lib/core/network/browser_game_bridge.dart \
            lib/core/game_room.dart \
            lib/games/name_animal_object/name_animal_object_game.dart \
            lib/games/xo/xo_game.dart \
            lib/games/checkers/checkers_game.dart

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p release apk/modern /tmp/gameslocal-update
          cp build/app/outputs/flutter-apk/app-release.apk release/gameslocal-flutter.apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/modern/gameslocal-flutter.apk
          sha256sum release/gameslocal-flutter.apk > release/gameslocal-flutter.apk.sha256
          cp -R lib /tmp/gameslocal-update/lib
          cp pubspec.yaml pubspec.lock /tmp/gameslocal-update/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameslocal-flutter-apk-${{ github.run_number }}
          path: |
            release/gameslocal-flutter.apk
            release/gameslocal-flutter.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish updated source and APK to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cp apk/modern/gameslocal-flutter.apk /tmp/gameslocal-flutter.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          rm -rf lib
          cp -R /tmp/gameslocal-update/lib ./lib
          cp /tmp/gameslocal-update/pubspec.yaml ./pubspec.yaml
          cp /tmp/gameslocal-update/pubspec.lock ./pubspec.lock
          mkdir -p apk/modern
          cp /tmp/gameslocal-flutter.apk apk/modern/gameslocal-flutter.apk
          git add lib pubspec.yaml pubspec.lock apk/modern/gameslocal-flutter.apk
          if git diff --cached --quiet; then
            echo "No source or APK changes to publish."
            exit 0
          fi
          git commit -m "Add responsive results audio and iPhone XO checkers multiplayer"
          git push origin HEAD:main

name: Build APK Direct

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'tools/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameslocal-main-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply permanent verified source upgrades
        run: |
          set -euo pipefail
          python3 tools/register_champions_penalty.py
          python3 tools/fix_champions_penalty_types.py
          python3 tools/enable_checkers_iphone.py
          python3 tools/fix_game_room_routing.py
          python3 tools/fix_name_game_rules.py
          python3 tools/apply_responsive_ui.py
          python3 tools/fix_sheikh_beard_rules.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/games/line_games/line_games.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'final t = rawT.clamp(0.0, 1.0);',
              'final t = rawT.clamp(0.0, 1.0).toDouble();',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/project_sanity_check.py

      - name: Create Android project files
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Remove generated tests
        run: rm -rf test

      - name: Configure Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />',
          ]
          additions = [item for item in permissions if item not in text]
          if additions:
              text = text.replace(marker, marker + '\n    ' + '\n    '.join(additions))
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze and build with diagnostics
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p build-status release apk/modern
          rm -f release/gameslocal-flutter.apk release/gameslocal-flutter.apk.sha256
          rm -f apk/modern/gameslocal-flutter.apk
          : > build-status/latest.log
          echo "Commit: $GITHUB_SHA" | tee -a build-status/latest.log
          echo "Run: $GITHUB_RUN_ID" | tee -a build-status/latest.log
          echo "=== PROJECT SANITY CHECK ===" | tee -a build-status/latest.log
          python3 tools/project_sanity_check.py 2>&1 | tee -a build-status/latest.log
          SANITY_CODE=${PIPESTATUS[0]}
          echo "=== DART FORMAT ===" | tee -a build-status/latest.log
          dart format lib 2>&1 | tee -a build-status/latest.log
          FORMAT_CODE=${PIPESTATUS[0]}
          echo "=== FLUTTER ANALYZE ===" | tee -a build-status/latest.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build-status/latest.log
          ANALYZE_CODE=${PIPESTATUS[0]}
          echo "=== FLUTTER BUILD APK ===" | tee -a build-status/latest.log
          if [ "$SANITY_CODE" -eq 0 ] && [ "$ANALYZE_CODE" -eq 0 ]; then
            flutter build apk --release 2>&1 | tee -a build-status/latest.log
            BUILD_CODE=${PIPESTATUS[0]}
          else
            echo "Build skipped because sanity/analyze failed." | tee -a build-status/latest.log
            BUILD_CODE=1
          fi
          echo "SANITY_CODE=$SANITY_CODE" | tee -a build-status/latest.log
          echo "FORMAT_CODE=$FORMAT_CODE" | tee -a build-status/latest.log
          echo "ANALYZE_CODE=$ANALYZE_CODE" | tee -a build-status/latest.log
          echo "BUILD_CODE=$BUILD_CODE" | tee -a build-status/latest.log
          if [ "$SANITY_CODE" -eq 0 ] && [ "$ANALYZE_CODE" -eq 0 ] && [ "$BUILD_CODE" -eq 0 ] && [ -s build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release/gameslocal-flutter.apk
            cp build/app/outputs/flutter-apk/app-release.apk apk/modern/gameslocal-flutter.apk
            sha256sum release/gameslocal-flutter.apk > release/gameslocal-flutter.apk.sha256
            echo "RESULT=SUCCESS" | tee -a build-status/latest.log
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT=FAILED" | tee -a build-status/latest.log
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload APK artifact
        if: steps.compile.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gameslocal-flutter-apk-${{ github.run_number }}
          path: |
            release/gameslocal-flutter.apk
            release/gameslocal-flutter.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified source and APK or failure report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/build-status/latest.log" /tmp/gameslocal-build.log
          SUCCESS=false
          if grep -q 'RESULT=SUCCESS' /tmp/gameslocal-build.log; then
            SUCCESS=true
            rm -rf /tmp/gameslocal-corrected-lib
            cp -R "$GITHUB_WORKSPACE/lib" /tmp/gameslocal-corrected-lib
            cp "$GITHUB_WORKSPACE/apk/modern/gameslocal-flutter.apk" /tmp/gameslocal.apk
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          mkdir -p build-status apk/modern
          cp /tmp/gameslocal-build.log build-status/latest.log
          if [ "$SUCCESS" = true ]; then
            rm -rf lib
            cp -R /tmp/gameslocal-corrected-lib ./lib
            cp /tmp/gameslocal.apk apk/modern/gameslocal-flutter.apk
            git add lib apk/modern/gameslocal-flutter.apk
          fi
          git add build-status/latest.log

          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          if [ "$SUCCESS" = true ]; then
            git commit -m "Publish verified source and Android APK"
          else
            git commit -m "Publish Android APK build failure report"
          fi
          git push origin HEAD:main

      - name: Fail workflow when APK build failed
        if: steps.compile.outputs.success != 'true'
        run: exit 1

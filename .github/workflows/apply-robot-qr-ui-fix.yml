name: Apply Robot QR UI Fix

on:
  push:
    branches: [fix/robot-qr-football-ui]
    paths:
      - '.github/workflows/apply-robot-qr-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/robot-qr-football-ui
          fetch-depth: 0
      - name: Apply fixes
        run: python tools/fix_robot_qr_ui.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/game_room.dart lib/games
          git commit -m "Restore robot mode and enlarge QR codes"
          git push origin HEAD:fix/robot-qr-football-ui

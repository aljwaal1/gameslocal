name: Apply Football Motion Overhaul

on:
  push:
    branches:
      - feature/football-motion-overhaul
    paths:
      - 'tools/apply_football_motion_overhaul.py'
      - '.github/workflows/apply-football-motion-overhaul.yml'

permissions:
  contents: write

concurrency:
  group: football-motion-overhaul-import
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overhaul branch
        uses: actions/checkout@v4
        with:
          ref: feature/football-motion-overhaul
          fetch-depth: 0

      - name: Import CC0 artwork and patch motion timing
        run: python3 tools/apply_football_motion_overhaul.py

      - name: Commit generated source and offline assets
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            assets/football/cc0 \
            lib/games/football/professional_penalty_game.dart \
            test/professional_penalty_visual_contract_test.dart
          git commit -m "Import CC0 football artwork and slow motion timing"
          git pull --rebase origin feature/football-motion-overhaul
          git push origin HEAD:feature/football-motion-overhaul

name: Fix audio switch clauses

on:
  push:
    branches: [feature/global-game-audio]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-game-audio
          fetch-depth: 0
      - name: Add explicit breaks to synthesized sound switch
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/core/audio_feedback.dart')
          s = p.read_text()
          cases = [
            "          value = note(t, 1450, duration) * .40;",
            "          value = (note(t, 1050, duration) + note(t, 1480, duration) * .42) * .52;",
            "          value = (note(t, 620, duration) + note(t, 880, duration) * .48) * .62;",
            "          value = math.sin(2 * math.pi * frequency * t) * envelope * .72;",
            "          value = note(t - index * segment, frequencies[index], segment) * .86;",
            "          value = (note(t, 185, duration) + note(t, 128, duration) * .52) * .72;",
            "          value = (noise * .72 + math.sin(2 * math.pi * 115 * t) * .28) * envelope * .82;",
            "          value = (shimmer + upper) * envelope * .70;",
            "          value = (noise * .50 + math.sin(2 * math.pi * 255 * t) * .50) * envelope * .75;",
            "          value = (note(t, 2350, duration) + note(t, 3150, duration) * .55) * .62;",
          ]
          for line in cases:
              needle = line + "\n"
              if needle not in s:
                  raise SystemExit(f'missing switch line: {line}')
              s = s.replace(needle, line + "\n          break;\n", 1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/audio_feedback.dart
          git commit -m "Fix synthesized audio switch clauses"
          git push origin HEAD:feature/global-game-audio

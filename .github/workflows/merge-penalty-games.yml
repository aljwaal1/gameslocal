name: Merge duplicate penalty games

on:
  push:
    branches: [feature/universal-qr-games]
    paths:
      - '.github/workflows/merge-penalty-games.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/universal-qr-games
          fetch-depth: 0
      - name: Merge football entries
        run: python tools/merge_penalty_games.py
      - name: Commit merged game list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Merge duplicate penalty games into one"
          git push origin HEAD:feature/universal-qr-games

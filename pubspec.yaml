name: gameslocal
description: Local multiplayer Android games over Wi-Fi/Hotspot, designed game-by-game.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: 1.17.0
  flutter_svg: ^2.0.17
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/football/
